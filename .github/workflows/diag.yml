name: diag

on:
  # Push to the default branch — every code push gets verified. Workflow
  # waits for Vercel to publish the new deploy before snapshotting.
  push:
    branches:
      - claude/build-doorknock-platform-ktF3d
  # Vercel's GitHub integration also emits deployment_status events for
  # terminal states; cheaper than waiting on push when it works.
  deployment_status: {}
  # Belt-and-braces liveness probe.
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch: {}

concurrency:
  group: diag
  cancel-in-progress: false

jobs:
  snapshot:
    # For deployment_status triggers, only react to terminal states —
    # otherwise we'd run for every intermediate pending/in_progress event.
    if: github.event_name != 'deployment_status' || contains(fromJson('["success","error","failure"]'), github.event.deployment_status.state)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Wait for Vercel build (push events only)
        if: github.event_name == 'push'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          PUSH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -z "${VERCEL_TOKEN:-}" ] || [ -z "${VERCEL_PROJECT_ID:-}" ]; then
            echo "no Vercel secrets — skipping wait"
            sleep 30
            exit 0
          fi
          # Poll until the latest deployment for this commit reaches a
          # terminal state, max ~5 minutes.
          for i in $(seq 1 30); do
            raw=$(curl -fsS --max-time 15 \
              -H "Authorization: Bearer $VERCEL_TOKEN" \
              "https://api.vercel.com/v6/deployments?projectId=$VERCEL_PROJECT_ID&limit=5" || echo '{}')
            state=$(echo "$raw" | jq -r --arg sha "$PUSH_SHA" '
              [.deployments[]? | select(.meta.githubCommitSha == $sha)] | .[0].state // empty
            ')
            echo "attempt $i: state=$state"
            if [ "$state" = "READY" ] || [ "$state" = "ERROR" ] || [ "$state" = "CANCELED" ]; then
              break
            fi
            sleep 10
          done

      - name: Fetch /api/diag
        id: fetch
        run: |
          set -euo pipefail
          mkdir -p .diag
          curl -fsS --max-time 30 \
            -H "Accept: application/json" \
            https://door-knocking.vercel.app/api/diag \
            | jq '.' > .diag/latest.json

      - name: Fetch Vercel deploy status + build logs on failure
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${VERCEL_TOKEN:-}" ] || [ -z "${VERCEL_PROJECT_ID:-}" ]; then
            echo '{"skipped":"no VERCEL_TOKEN or VERCEL_PROJECT_ID"}' > .diag/vercel.json
            exit 0
          fi
          raw=$(curl -fsS --max-time 20 \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v6/deployments?projectId=$VERCEL_PROJECT_ID&limit=1")
          echo "$raw" | jq '{
              state: .deployments[0].state,
              sha: (.deployments[0].meta.githubCommitSha // "" | .[0:7]),
              url: .deployments[0].url,
              uid: .deployments[0].uid,
              created_at: ((.deployments[0].created / 1000) | todate),
              target: .deployments[0].target
            }' > .diag/vercel.json

          state=$(jq -r '.state // empty' .diag/vercel.json)
          uid=$(jq -r '.uid // empty' .diag/vercel.json)
          if [ "$state" = "ERROR" ] && [ -n "$uid" ]; then
            echo "Deployment $uid is ERROR — pulling build events…"
            curl -fsS --max-time 30 \
              -H "Authorization: Bearer $VERCEL_TOKEN" \
              "https://api.vercel.com/v3/deployments/$uid/events?builds=1&follow=0&limit=2000" \
              | jq -r '.[]? | "\(.date // "?") [\(.type // "log")] \(.payload.text // .text // "")"' \
              > .diag/vercel-build.log || true
            echo "wrote $(wc -l < .diag/vercel-build.log 2>/dev/null || echo 0) log lines"
          else
            rm -f .diag/vercel-build.log
          fi

      - name: Summarize
        id: summarize
        run: |
          set -euo pipefail
          jq -r '
            "# diag @ \(.at)",
            "",
            "## env",
            (.env | to_entries[] | "- \(.key): \(.value)"),
            "",
            "## checks",
            (.checks[] | "- \(if .ok then "✅" else "❌" end) \(.name) — \(.detail // "")"),
            "",
            "## tables",
            (.tables | to_entries[] | "- \(.key): \(.value)"),
            "",
            (if .migrations then
              "## migrations",
              "- expected: \(.migrations.expected_count)",
              "- applied: \(.migrations.applied_count)",
              (if (.migrations.missing | length) > 0 then "- missing: \(.migrations.missing | join(", "))" else "- missing: none" end),
              (if (.migrations.extras | length) > 0 then "- extras: \(.migrations.extras | join(", "))" else empty end)
             else empty end)
          ' .diag/latest.json > .diag/summary.md

          if [ -f .diag/vercel.json ]; then
            echo "" >> .diag/summary.md
            jq -r '
              if .skipped then
                "## vercel", "- " + .skipped
              else
                "## vercel",
                "- state: \(.state // "?")",
                "- sha: \(.sha // "?")",
                "- target: \(.target // "?")",
                "- created: \(.created_at // "?")",
                "- url: \(.url // "?")"
              end
            ' .diag/vercel.json >> .diag/summary.md
          fi

      - name: Compute check status
        id: status
        run: |
          set -euo pipefail
          failed=$(jq -r '.checks | map(select(.ok == false)) | length' .diag/latest.json)
          : > .diag/failures.md
          if [ "$failed" -gt 0 ]; then
            jq -r '.checks | map(select(.ok == false)) | .[] | "- **\(.name)** — \(.detail // "")"' \
              .diag/latest.json >> .diag/failures.md
          fi
          if [ -f .diag/vercel.json ]; then
            vstate=$(jq -r '.state // empty' .diag/vercel.json)
            if [ "$vstate" = "ERROR" ] || [ "$vstate" = "CANCELED" ]; then
              echo "- **vercel.latest_deploy** — state=$vstate" >> .diag/failures.md
              failed=$((failed + 1))
            fi
          fi
          echo "failed=$failed" >> "$GITHUB_OUTPUT"
          if [ "$failed" -eq 0 ]; then
            rm -f .diag/failures.md
          fi

      - name: Commit if changed
        run: |
          set -euo pipefail
          git config user.email "diag-bot@users.noreply.github.com"
          git config user.name  "diag-bot"
          git add .diag/latest.json .diag/summary.md
          git add .diag/vercel.json .diag/vercel-build.log 2>/dev/null || true
          # Remove tracked build log if we deleted it (state is no longer ERROR)
          if [ ! -f .diag/vercel-build.log ] && git ls-files --error-unmatch .diag/vercel-build.log >/dev/null 2>&1; then
            git rm .diag/vercel-build.log
          fi
          if git diff --cached --quiet; then
            echo "no diag changes"
            exit 0
          fi
          git commit -m "diag snapshot [$(date -u +%Y-%m-%dT%H:%MZ)]"
          git push

      - name: Open or update red-status issue
        if: steps.status.outputs.failed != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FAILED: ${{ steps.status.outputs.failed }}
        run: |
          set -euo pipefail
          title="diag: infra red"
          tail_logs=""
          if [ -f .diag/vercel-build.log ]; then
            tail_logs=$(printf '\n\n### Vercel build log (last 40 lines)\n```\n%s\n```\n\nFull log: [`.diag/vercel-build.log`](../blob/HEAD/.diag/vercel-build.log)' \
              "$(tail -n 40 .diag/vercel-build.log)")
          fi
          body=$(cat <<EOF
          **$FAILED check(s) failing** as of $(date -u +%Y-%m-%dT%H:%MZ)

          $(cat .diag/failures.md)

          Full snapshot: [\`.diag/summary.md\`](../blob/HEAD/.diag/summary.md).$tail_logs

          This issue auto-closes on the next green diag run.
          EOF
          )
          existing=$(gh issue list --state open --search "$title in:title" --json number,title \
            --jq ".[] | select(.title == \"$title\") | .number" | head -n 1)
          if [ -n "$existing" ]; then
            gh issue edit "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body" --label diag 2>/dev/null \
              || gh issue create --title "$title" --body "$body"
          fi

      - name: Close red-status issue when green
        if: steps.status.outputs.failed == '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          title="diag: infra red"
          existing=$(gh issue list --state open --search "$title in:title" --json number,title \
            --jq ".[] | select(.title == \"$title\") | .number" | head -n 1)
          if [ -n "$existing" ]; then
            gh issue close "$existing" --comment "All checks green as of $(date -u +%Y-%m-%dT%H:%MZ)."
          fi
