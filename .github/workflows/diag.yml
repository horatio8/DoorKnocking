name: diag

on:
  schedule:
    # Every 30 minutes. Shift off the hour so we don't collide with Vercel
    # edge-caching / other scheduled jobs.
    - cron: "7,37 * * * *"
  workflow_dispatch: {}

concurrency:
  group: diag
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # persist-credentials so the final `git push` uses GITHUB_TOKEN.
          persist-credentials: true

      - name: Fetch /api/diag
        id: fetch
        run: |
          set -euo pipefail
          mkdir -p .diag
          # -f fails on non-2xx, --max-time caps wall time, -sS is silent+show-errors.
          curl -fsS --max-time 30 \
            -H "Accept: application/json" \
            https://door-knocking.vercel.app/api/diag \
            | jq '.' > .diag/latest.json

      - name: Summarize
        id: summarize
        run: |
          set -euo pipefail
          jq -r '
            def yn: if . then "✅" else "❌" end;
            "# diag @ \(.at)",
            "",
            "## env",
            (.env | to_entries[] | "- \(.key): \(.value)"),
            "",
            "## checks",
            (.checks[] | "- \(if .ok then "✅" else "❌" end) \(.name) — \(.detail // "")"),
            "",
            "## tables",
            (.tables | to_entries[] | "- \(.key): \(.value)")
          ' .diag/latest.json > .diag/summary.md

      - name: Commit if changed
        run: |
          set -euo pipefail
          git config user.email "diag-bot@users.noreply.github.com"
          git config user.name  "diag-bot"
          git add .diag/latest.json .diag/summary.md
          if git diff --cached --quiet; then
            echo "no diag changes"
            exit 0
          fi
          git commit -m "diag snapshot [$(date -u +%Y-%m-%dT%H:%MZ)]"
          git push
